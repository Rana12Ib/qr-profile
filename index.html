<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --text:#16161a; --muted:#6b6b73; --line:#e3e1db;
  --accent:#4338ca; --accent-ink:#ffffff; --accent-soft:#e9e8fb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214; --surface:#1b1b1f; --text:#f3f2ee; --muted:#9d9da6; --line:#2b2b31;
    --accent:#8b86f5; --accent-ink:#0f0f18; --accent-soft:#25244a;
  }
}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1b1b1f; --text:#f3f2ee; --muted:#9d9da6; --line:#2b2b31;
  --accent:#8b86f5; --accent-ink:#0f0f18; --accent-soft:#25244a;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
}
main{
  width:100%;max-width:440px;padding:40px 24px 32px;
  display:flex;flex-direction:column;
}
.eyebrow{
  display:flex;align-items:center;gap:10px;margin:0 0 28px;
  font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.eyebrow i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:block}
h1{
  margin:0;font-size:clamp(44px,13vw,60px);line-height:.98;font-weight:750;letter-spacing:-.035em;
}
.role{margin:14px 0 0;font-size:clamp(22px,6vw,26px);font-weight:600;letter-spacing:-.015em;color:var(--accent)}
.meta{
  margin:22px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:2px 0;
  font-size:14px;line-height:1.5;color:var(--muted);
}
.meta li:not(:last-child)::after{content:"·";margin:0 8px;color:var(--line);font-weight:700}
.quote{
  margin:22px 0 0;padding-left:16px;border-left:2px solid var(--accent);
  font-size:17px;line-height:1.5;color:var(--text);
}
.links{display:flex;flex-direction:column;gap:12px;margin-top:36px}
.btn{
  display:flex;align-items:center;gap:14px;min-height:60px;padding:0 20px;
  border-radius:16px;text-decoration:none;font-size:17px;font-weight:600;letter-spacing:-.005em;
  color:var(--text);background:var(--surface);border:1px solid var(--line);
  transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease,background-color .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn span{flex:1}
.btn .arrow{width:18px;height:18px;opacity:.55;transition:transform .2s ease,opacity .2s ease}
.btn:hover{border-color:var(--accent);box-shadow:0 6px 20px -10px rgba(67,56,202,.35)}
.btn:hover .arrow{transform:translateX(3px);opacity:1}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn.primary{
  min-height:68px;font-size:18px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
}
.btn.primary:hover{box-shadow:0 10px 26px -10px var(--accent)}
.btn.primary .arrow{opacity:.85}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row .btn{padding:0 16px;gap:10px;font-size:16px}
.row .btn span{flex:1}
.wide{margin-top:0}
@media (max-width:360px){.row{grid-template-columns:1fr}}
@media (min-width:720px){
  main{max-width:480px;padding-top:56px;padding-bottom:56px}
}
@media (prefers-reduced-motion:no-preference){
  .rise{opacity:0;transform:translateY(10px);animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
  .d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.2s}.d4{animation-delay:.3s}
  @keyframes rise{to{opacity:1;transform:none}}
}
</style>
</head>
